<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <style>
    .axis { stroke: #8a8a8a; stroke-width: 1; }
    .grid { stroke: #2a2a2a; stroke-width: 1; stroke-dasharray: 2 3; }
    .label { fill: #c8c8c8; font-size: 11px; }
    .title { fill: #f0f0f0; font-size: 14px; font-weight: 600; }
    .subtitle { fill: #9a9a9a; font-size: 11px; }
    .line-27b { fill: none; stroke: #f59e0b; stroke-width: 2.5; stroke-linejoin: round; }
    .line-moe { fill: none; stroke: #4ade80; stroke-width: 2.5; stroke-linejoin: round; }
    .dot-27b { fill: #f59e0b; }
    .dot-moe { fill: #4ade80; }
    .anno-27b { fill: #fbbf24; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .anno-moe { fill: #86efac; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .axis-label { fill: #c8c8c8; font-size: 11px; }
  </style>
  <rect width="720" height="380" fill="#111317"/>

  <text class="title" x="40" y="28">27B-dense (LB) vs 35B-MoE (TP=2+EP) — aggregate tok/s</text>
  <text class="subtitle" x="40" y="46">Same hardware (dual RTX 3090). 1024 in / 1024 out. Different configs but same single-endpoint goal.</text>

  <!-- chart area x [80, 670], y [80, 300] -->
  <line class="axis" x1="80"  y1="300" x2="670" y2="300"/>
  <line class="axis" x1="80"  y1="80"  x2="80"  y2="300"/>

  <!-- y axis: 0..300 tok/s -->
  <line class="grid" x1="80" y1="227" x2="670" y2="227"/><text class="axis-label" x="74" y="231" text-anchor="end">100</text>
  <line class="grid" x1="80" y1="153" x2="670" y2="153"/><text class="axis-label" x="74" y="157" text-anchor="end">200</text>
  <line class="grid" x1="80" y1="80"  x2="670" y2="80" /><text class="axis-label" x="74" y="84"  text-anchor="end">300</text>
  <text class="axis-label" x="74" y="304" text-anchor="end">0</text>

  <!-- x ticks -->
  <text class="axis-label" x="130" y="320" text-anchor="middle">C=1</text>
  <text class="axis-label" x="250" y="320" text-anchor="middle">C=2</text>
  <text class="axis-label" x="410" y="320" text-anchor="middle">C=4</text>
  <text class="axis-label" x="600" y="320" text-anchor="middle">C=8</text>
  <text class="axis-label" x="375" y="345" text-anchor="middle">concurrency (parallel requests)</text>
  <text class="axis-label" x="40" y="195" transform="rotate(-90, 40, 195)" text-anchor="middle">aggregate output tok/s</text>

  <!-- y mapping: y = 300 - tps * (220/300) = 300 - tps*0.733 -->
  <!-- 27B numbers -->
  <!-- C=1: 81.8 → 240, C=2: 154 → 187, C=4: 225.4 → 135, C=8: 167 → 178 -->
  <path class="line-27b" d="M 130 240 L 250 187 L 410 135 L 600 178">
    <animate attributeName="stroke-dasharray" from="0 1000" to="1000 0" dur="1.4s" fill="freeze"/>
  </path>
  <circle class="dot-27b" cx="130" cy="240" r="4"/>
  <circle class="dot-27b" cx="250" cy="187" r="4"/>
  <circle class="dot-27b" cx="410" cy="135" r="5"/>
  <circle class="dot-27b" cx="600" cy="178" r="4"/>
  <text class="anno-27b" x="130" y="232">82</text>
  <text class="anno-27b" x="250" y="179">154</text>
  <text class="anno-27b" x="410" y="125">225</text>
  <text class="anno-27b" x="600" y="170">167</text>

  <!-- 35B-MoE numbers -->
  <!-- C=1: 90.3 → 234, C=2: 161.5 → 182, C=4: 282.7 → 93, C=8: 282.2 → 93 (saturated) -->
  <path class="line-moe" d="M 130 234 L 250 182 L 410 93 L 600 93">
    <animate attributeName="stroke-dasharray" from="0 1000" to="1000 0" dur="1.4s" begin="0.3s" fill="freeze"/>
  </path>
  <circle class="dot-moe" cx="130" cy="234" r="4"/>
  <circle class="dot-moe" cx="250" cy="182" r="4"/>
  <circle class="dot-moe" cx="410" cy="93" r="6"/>
  <circle class="dot-moe" cx="600" cy="93" r="5"/>
  <text class="anno-moe" x="130" y="220">90</text>
  <text class="anno-moe" x="250" y="170">161</text>
  <text class="anno-moe" x="410" y="83">283</text>
  <text class="anno-moe" x="600" y="83">282</text>

  <!-- Legend -->
  <g transform="translate(80, 362)">
    <line class="line-27b" x1="0" y1="0" x2="20" y2="0"/>
    <circle class="dot-27b" cx="10" cy="0" r="3"/>
    <text class="axis-label" x="28" y="4">Qwen3.6-27B-dense (2 replicas + nginx LB, MTP n=3, max-num-seqs=2)</text>
    <line class="line-moe" x1="0" y1="20" x2="20" y2="20"/>
    <circle class="dot-moe" cx="10" cy="20" r="3"/>
    <text class="axis-label" x="28" y="24">Qwen3.6-35B-A3B MoE (TP=2+expert-parallel, max-num-seqs=4)</text>
  </g>
</svg>
