<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <style>
    .axis { stroke: #8a8a8a; stroke-width: 1; }
    .grid { stroke: #2a2a2a; stroke-width: 1; stroke-dasharray: 2 3; }
    .label { fill: #c8c8c8; font-size: 11px; }
    .title { fill: #f0f0f0; font-size: 14px; font-weight: 600; }
    .subtitle { fill: #9a9a9a; font-size: 11px; }
    .line-tps { fill: none; stroke: #4ade80; stroke-width: 2.5; stroke-linejoin: round; }
    .line-ttft { fill: none; stroke: #f87171; stroke-width: 2; stroke-dasharray: 4 4; stroke-linejoin: round; }
    .dot { fill: #4ade80; }
    .dot-ttft { fill: #f87171; }
    .anno { fill: #ffffff; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .anno-bad { fill: #fca5a5; font-size: 11px; text-anchor: middle; }
    .axis-label { fill: #c8c8c8; font-size: 11px; }
    .sweet { fill: rgba(74, 222, 128, 0.10); }
  </style>
  <rect width="720" height="380" fill="#111317"/>

  <text class="title" x="40" y="28">Aggregate throughput vs concurrency — 2 replicas behind nginx LB</text>
  <text class="subtitle" x="40" y="46">Single endpoint :8400, least-conn routing · 1024 in / 1024 out · max-num-seqs=2 per replica</text>

  <!-- chart area x [80, 670], y [80, 300] -->
  <!-- y0 (left, tok/s 0..250): 220 px tall -->
  <!-- x: 4 buckets at C=1,2,4,8, log-ish spacing -->
  <!-- positions: C=1 → 130, C=2 → 250, C=4 → 410, C=8 → 600 -->

  <!-- sweet spot shading at C=4 -->
  <rect class="sweet" x="370" y="80" width="80" height="220"/>
  <text class="anno" x="410" y="76" fill="#4ade80">sweet spot</text>

  <!-- axes -->
  <line class="axis" x1="80"  y1="300" x2="670" y2="300"/>
  <line class="axis" x1="80"  y1="80"  x2="80"  y2="300"/>

  <!-- gridlines for tok/s (0, 50, 100, 150, 200, 250) -->
  <g>
    <line class="grid" x1="80" y1="256" x2="670" y2="256"/><text class="axis-label" x="74" y="260" text-anchor="end">50</text>
    <line class="grid" x1="80" y1="212" x2="670" y2="212"/><text class="axis-label" x="74" y="216" text-anchor="end">100</text>
    <line class="grid" x1="80" y1="168" x2="670" y2="168"/><text class="axis-label" x="74" y="172" text-anchor="end">150</text>
    <line class="grid" x1="80" y1="124" x2="670" y2="124"/><text class="axis-label" x="74" y="128" text-anchor="end">200</text>
    <line class="grid" x1="80" y1="80"  x2="670" y2="80" /><text class="axis-label" x="74" y="84"  text-anchor="end">250</text>
    <text class="axis-label" x="74" y="304" text-anchor="end">0</text>
  </g>

  <!-- x-axis ticks -->
  <g>
    <text class="axis-label" x="130" y="320" text-anchor="middle">C=1</text>
    <text class="axis-label" x="250" y="320" text-anchor="middle">C=2</text>
    <text class="axis-label" x="410" y="320" text-anchor="middle">C=4</text>
    <text class="axis-label" x="600" y="320" text-anchor="middle">C=8</text>
  </g>
  <text class="axis-label" x="375" y="345" text-anchor="middle">concurrency (parallel requests)</text>

  <!-- y axis label -->
  <text class="axis-label" x="40" y="195" transform="rotate(-90, 40, 195)" text-anchor="middle">aggregate output tok/s</text>

  <!-- Throughput line: (1, 81.8), (2, 154.0), (4, 225.4), (8, 167.0) -->
  <!-- y mapping: y = 300 - tps * (220/250) = 300 - tps*0.88 -->
  <!-- C=1 → (130, 300-72) = (130, 228) -->
  <!-- C=2 → (250, 300-135.5) = (250, 164.5) -->
  <!-- C=4 → (410, 300-198.4) = (410, 101.6) -->
  <!-- C=8 → (600, 300-147.0) = (600, 153.0) -->
  <path class="line-tps" d="M 130 228 L 250 164.5 L 410 101.6 L 600 153.0">
    <animate attributeName="stroke-dasharray" from="0 1000" to="1000 0" dur="1.5s" fill="freeze"/>
  </path>
  <circle class="dot" cx="130" cy="228" r="5">
    <animate attributeName="r" from="0" to="5" dur="0.3s" begin="0.4s" fill="freeze"/>
  </circle>
  <circle class="dot" cx="250" cy="164.5" r="5">
    <animate attributeName="r" from="0" to="5" dur="0.3s" begin="0.7s" fill="freeze"/>
  </circle>
  <circle class="dot" cx="410" cy="101.6" r="6">
    <animate attributeName="r" from="0" to="6" dur="0.3s" begin="1.0s" fill="freeze"/>
  </circle>
  <circle class="dot" cx="600" cy="153.0" r="5">
    <animate attributeName="r" from="0" to="5" dur="0.3s" begin="1.3s" fill="freeze"/>
  </circle>
  <text class="anno" x="130" y="218">81.8</text>
  <text class="anno" x="250" y="154">154.0</text>
  <text class="anno" x="410" y="91">225.4</text>
  <text class="anno-bad" x="600" y="143">167.0</text>

  <!-- TTFT secondary line, normalized ms→y on same axis (1000 ms ~ small, 19000 ms ~ large) -->
  <!-- Use TTFT/100 → y mapping 0..200, scaled so 200 → top (y=80). y = 300 - (ms/100) * 1.1, capped. -->
  <!-- 1020 → 300-11.2 = 288.8 -->
  <!-- 841  → 300-9.3  = 290.7 -->
  <!-- 1437 → 300-15.8 = 284.2 -->
  <!-- 19230 → off-chart, draw dashed up arrow -->
  <path class="line-ttft" d="M 130 288.8 L 250 290.7 L 410 284.2 L 600 250"/>
  <circle class="dot-ttft" cx="130" cy="288.8" r="3"/>
  <circle class="dot-ttft" cx="250" cy="290.7" r="3"/>
  <circle class="dot-ttft" cx="410" cy="284.2" r="3"/>
  <circle class="dot-ttft" cx="600" cy="250"  r="3"/>
  <text class="anno-bad" x="600" y="244">19s queue!</text>

  <!-- Legend -->
  <g transform="translate(80, 362)">
    <line class="line-tps" x1="0" y1="0" x2="20" y2="0"/>
    <circle class="dot" cx="10" cy="0" r="3"/>
    <text class="axis-label" x="28" y="4">aggregate tok/s</text>
    <line class="line-ttft" x1="180" y1="0" x2="200" y2="0"/>
    <circle class="dot-ttft" cx="190" cy="0" r="3"/>
    <text class="axis-label" x="208" y="4">mean TTFT (the queue tax)</text>
  </g>
</svg>
