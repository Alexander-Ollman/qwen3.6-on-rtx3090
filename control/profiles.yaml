# Model profiles for qwen-control.
# Each profile maps a logical model name to a launcher script and an upstream URL.
# The control plane stops the previous profile's containers, runs the chosen
# launcher, and waits for the ready_url to return 200 before flipping state.

profiles:
  27b-dense:
    display_name: "Qwen3.6-27B Dense"
    served_model_id: qwen36-27b
    upstream: "http://localhost:8400"
    launcher: /host/repo/launch-27b.sh
    container_names:
      - qwen36-vllm-1
      - qwen36-vllm-2
      - qwen36-lb
    ready_url: "http://localhost:8400/v1/models"
    expected_load_seconds: 100
    description: |
      Two replicas behind nginx, MTP n=3 spec-decode, FP8 KV cache.
      Peak: 100 tok/s single-stream, 225 tok/s aggregate at C=4.

  35b-moe:
    display_name: "Qwen3.6-35B-A3B MoE"
    served_model_id: qwen36-35b-moe
    upstream: "http://localhost:8500"
    launcher: /host/repo/launch-35b-moe.sh
    container_names:
      - qwen36-moe
    ready_url: "http://localhost:8500/v1/models"
    expected_load_seconds: 90
    description: |
      Single instance TP=2 + expert-parallel. No spec-decode (regresses on this MoE).
      Peak: 99 tok/s single-stream, 283 tok/s aggregate at C=4.

  granite-8b:
    display_name: "Granite-4.1-8B (AWQ-INT4)"
    served_model_id: granite-8b
    upstream: "http://localhost:8400"
    launcher: /host/repo/launch-granite-8b.sh
    container_names:
      - granite-8b-1
      - granite-8b-2
      - granite-lb-8b
    ready_url: "http://localhost:8400/v1/models"
    expected_load_seconds: 45
    description: |
      Two replicas behind nginx least_conn LB. cyankiwi/granite-4.1-8b-AWQ-INT4 (5.4 GB).
      Peak: 105 tok/s single-stream, 1222 tok/s aggregate at C=64 (2624 peak burst).
      The agentic-fanout workhorse — best at C=2..8 single-call latency.

  granite-30b:
    display_name: "Granite-4.1-30B (AWQ-INT4 TP=2)"
    served_model_id: granite-30b
    upstream: "http://localhost:8500"
    launcher: /host/repo/launch-granite-30b.sh
    container_names:
      - granite-30b
    ready_url: "http://localhost:8500/v1/models"
    expected_load_seconds: 75
    description: |
      Single instance TP=2 across both 3090s. drawais/Granite-4.1-30B-AWQ-INT4
      (sym INT4 g=128). Peak: 44 tok/s single-stream, 216 tok/s aggregate at C=8.
      Use for highest-quality generations; the 8B is faster for everything else.

  granite-3b-eagle3:
    display_name: "Granite-4.1-3B + EAGLE-3 (trained)"
    served_model_id: granite-3b-eagle
    upstream: "http://localhost:8500"
    launcher: /host/repo/launch-granite-3b-eagle3.sh
    container_names:
      - granite-3b-eagle
    ready_url: "http://localhost:8500/v1/models"
    expected_load_seconds: 45
    description: |
      Single 3090, granite-4.1-3b BF16 with our 5000-step trained EAGLE-3 head as
      speculative draft (n=5). 105 tok/s C=1, +13.5% over baseline. The latency-
      sensitive endpoint — pair with granite-8b for batch traffic on the other GPU.

# Containers we don't want grabbing GPUs anymore. install.sh sets these to
# restart=no and stops them once. Listed here for reference / re-run.
gpu_competitors:
  - 3-proxy-docker-vllm-1
  - sglang
  - ollama
